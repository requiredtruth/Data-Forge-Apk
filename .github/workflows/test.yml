name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: ./test.sh

  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: ./build_android.sh
      - run: ./test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DataForge-1.0.3
          path: |
            releases/DataForge-1.0.3.apk
            releases/DataForge-1.0.3.apk.sha256
          if-no-files-found: error
      - name: Publish APK release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.3 >/dev/null 2>&1; then
            gh release upload v1.0.3 releases/DataForge-1.0.3.apk releases/DataForge-1.0.3.apk.sha256 --clobber
          else
            gh release create v1.0.3 releases/DataForge-1.0.3.apk releases/DataForge-1.0.3.apk.sha256 --title "DataForge 1.0.3" --notes "Offline visual CSV, JSON, and SQLite assembly for Android. This clean public build uses the application ID app.dataforge.mobile."
          fi
